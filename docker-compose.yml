version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interview_trainer_agent
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - WATSONX_API_KEY=${WATSONX_API_KEY}
      - WATSONX_PROJECT_ID=${WATSONX_PROJECT_ID}
      - WATSONX_MODEL_ID=${WATSONX_MODEL_ID:-ibm/granite-4-h-small}
      - WATSONX_URL=${WATSONX_URL:-https://us-south.ml.cloud.ibm.com}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-jwt-key}
    volumes:
      - data:/app/backend/data

volumes:
  data:
