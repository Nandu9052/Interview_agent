services:
  - type: web
    name: interview-trainer-ai
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: WATSONX_API_KEY
        sync: false
      - key: WATSONX_PROJECT_ID
        sync: false
      - key: WATSONX_MODEL_ID
        value: ibm/granite-4-h-small
      - key: WATSONX_URL
        value: https://us-south.ml.cloud.ibm.com
      - key: JWT_SECRET_KEY
        generateValue: true
